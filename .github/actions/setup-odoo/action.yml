name: Set up Odoo 16.0
description: The latest Odoo 16.0 source, its Python requirements, and websocket-client for the browser tests
runs:
  using: composite
  steps:
    - name: Odoo 16.0 commit
      id: odoo
      shell: bash
      run: echo "sha=$(git ls-remote https://github.com/odoo/odoo refs/heads/16.0 | cut -f1)" >> "$GITHUB_OUTPUT"
    - name: Odoo source cache
      id: cache
      uses: actions/cache@v6
      with:
        path: odoo
        key: odoo-16.0-${{ steps.odoo.outputs.sha }}
    - name: Odoo source
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: git clone --depth 1 --branch 16.0 https://github.com/odoo/odoo.git odoo
    - name: System libraries
      shell: bash
      run: sudo apt-get update -q && sudo apt-get install -yq libldap2-dev libsasl2-dev libpq-dev postgresql-client
    - uses: actions/setup-python@v7
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: odoo/requirements.txt
    - name: Python requirements
      shell: bash
      # gevent 21.8.0, pinned for Python 3.10, has no wheel and no longer builds (Cython 3): gevent 22.10.2 and
      # greenlet 2.0.2, pinned for Python 3.11, have wheels for 3.10.
      # websocket-client runs the browser tests (tours).
      run: |
        grep -vE '^(gevent|greenlet)==' odoo/requirements.txt > "$RUNNER_TEMP/requirements.txt"
        pip install -r "$RUNNER_TEMP/requirements.txt" gevent==22.10.2 greenlet==2.0.2 websocket-client
