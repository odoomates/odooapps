name: Tests

on:
  push:
    branches: ['20.0']
  pull_request:
    branches: ['20.0']
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: odoo
      PGPASSWORD: odoo
      ODOO_PATH: ${{ github.workspace }}/odoo
      LOG_DIR: ${{ github.workspace }}/logs
    steps:
      - uses: actions/checkout@v7
        with:
          path: odooapps
      - uses: ./odooapps/.github/actions/setup-odoo
      - name: Install and test
        run: odooapps/.github/scripts/run_odoo_tests.sh test_suite "$(cd odooapps && ls -d */__manifest__.py | cut -d/ -f1 | paste -sd, -)"
      - name: Log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: log
          path: logs/
