name: Feature request
description: Suggest a new feature or an improvement of a module.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the suggestion. Please search the [existing issues](https://github.com/odoomates/odooapps/issues?q=is%3Aissue) first: someone may have asked for it already.
  - type: input
    id: module
    attributes:
      label: Module
      description: The module to improve, or "new module".
      placeholder: om_account_budget
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Odoo version
      options:
        - "20.0"
        - "19.0"
        - "18.0"
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: The business need
      description: What are you trying to do, and why can't you do it today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: The solution you would like
      description: "How it could work in Odoo: menus, fields, reports…"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other solutions or workarounds you considered.
  - type: textarea
    id: context
    attributes:
      label: Other information
      description: Screenshots, examples, how other software does it…
